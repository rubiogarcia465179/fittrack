# Web de FitTrack en Netlify (plan gratuito): la web ES la app (R-131).
# Netlify instala app/ y ejecuta el export web de Expo en cada push a main.
[build]
  base = "app"
  command = "npm ci && npx expo export --platform web --output-dir dist && cp dist/index.html dist/404.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Una sola página (las pestañas son estado, no rutas): todo va a index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caché larga para los archivos con hash de Expo; el HTML siempre fresco.
[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
